name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Copy Assets to Root & Update index.html
        run: python3 prepare_gh_pages.py

      # GitHub Pages 設定為「從 main 分支根目錄發佈」，所以建置產物必須回寫 main。
      # 先前使用 peaceiris/actions-gh-pages 並指定 publish_branch: main，該 action
      # 會以 "You deploy from main to main" 拒絕執行，導致每一次部署都失敗，
      # 線上永遠停留在舊的 bundle。改為直接提交產物，並用 [skip ci] 避免遞迴觸發。
      - name: Commit built assets back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets
          if git diff --staged --quiet; then
            echo "建置產物無變化，略過提交。"
          else
            git commit -m "chore(deploy): publish built assets for GitHub Pages [skip ci]"
            git push origin HEAD:main
          fi
